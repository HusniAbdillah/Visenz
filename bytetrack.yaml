# ByteTrack configuration for edge-vision-counter
# Tuned for full-body crowd counting over Wi-Fi RTSP links.
# Baseline assumes ~30 FPS source with frame skipping upstream. If the
# effective inference FPS falls to 10-15, increase track_buffer toward
# 45-60 to preserve similar wall-clock retention for short occlusions.

tracker_type: bytetrack
track_high_thresh: 0.25       # Equivalent to track_thresh: keep person detections reasonably strict
track_low_thresh: 0.10        # Second-stage recovery after partial occlusion
new_track_thresh: 0.35        # Require a more confident confirmation before spawning a new ID
track_buffer: 30              # Enough retention for brief occlusion at 30 FPS baseline
match_thresh: 0.70            # Slightly stricter matching to reduce ID swaps in dense crossings
max_age: 30                   # Mirror the buffer window for readers that honor max_age
min_hits: 3                   # Require a few consistent hits before a new track is considered stable
fuse_score: True
